name: Bug report
description: Report a reproducible problem with Traceboard.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a sample or synthetic source files. Remove credentials and private logs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, and sample or Groq mode.
  - type: textarea
    id: output
    attributes:
      label: Relevant error or screenshot
