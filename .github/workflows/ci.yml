name: Verify Traceboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traceboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check code, tests, and repository hygiene
        run: npm run check
      - name: Check committed history
        run: npm run repo:check -- --history
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Build Worker and client
        run: npm run build
      - name: Install browser for smoke checks
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile flows
        run: npm run test:e2e
